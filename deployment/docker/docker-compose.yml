name: lodestone

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in deployment/docker/.env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      sql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in deployment/docker/.env}"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sql -U sa
        -P "$${MSSQL_SA_PASSWORD}" -C -b
        -Q "IF DB_ID(N'Lodestone') IS NULL CREATE DATABASE [Lodestone];
        IF DB_ID(N'LodestoneHangfire') IS NULL CREATE DATABASE [LodestoneHangfire];"

  web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: "http://0.0.0.0:8080"
      Kestrel__Endpoints__Https__Url: "https://0.0.0.0:5001"
      Kestrel__Certificates__Default__Path: /https/lodestone.crt
      Kestrel__Certificates__Default__KeyPath: /https/lodestone.key
      ConnectionStrings__DefaultConnection: >-
        Server=sql,1433;Database=Lodestone;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in deployment/docker/.env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true
      ConnectionStrings__HangfireConnection: >-
        Server=sql,1433;Database=LodestoneHangfire;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in deployment/docker/.env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true
      Startup__InitializeDatabase: "true"
      Startup__ProtectLegacyJournalNotes: "true"
      Startup__UseHangfire: "${LODESTONE_USE_HANGFIRE:-true}"
      SeedData__AdminEmail: "${LODESTONE_ADMIN_EMAIL:?Set LODESTONE_ADMIN_EMAIL in deployment/docker/.env}"
      SeedData__AdminPassword: "${LODESTONE_ADMIN_PASSWORD:?Set LODESTONE_ADMIN_PASSWORD in deployment/docker/.env}"
      LODESTONE_ADMIN_PASSWORD: "${LODESTONE_ADMIN_PASSWORD:?Set LODESTONE_ADMIN_PASSWORD in deployment/docker/.env}"
      LODESTONE_SQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in deployment/docker/.env}"
      Encryption__KeyRingPath: /app/keys
      Encryption__ApplicationName: Lodestone
      Encryption__RequireProtectedJournalNotes: "true"
      MachineLearning__Enabled: "${LODESTONE_ML_ENABLED:-false}"
      MachineLearning__ModelPath: App_Data/ml/risk-model.zip
      MachineLearning__MetadataPath: App_Data/ml/risk-model.metadata.json
      Email__SmtpHost: "${LODESTONE_SMTP_HOST:-smtp.example.invalid}"
      Email__SmtpPort: "${LODESTONE_SMTP_PORT:-587}"
      Email__FromAddress: "${LODESTONE_EMAIL_FROM:-no-reply@example.invalid}"
      Email__UserName: "${LODESTONE_SMTP_USERNAME:-}"
      Email__Password: "${LODESTONE_SMTP_PASSWORD:-}"
      PublicUrl__BaseUrl: "${LODESTONE_PUBLIC_BASE_URL:-https://localhost:5001}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - data-protection-keys:/app/keys
      - https-certs:/https
      - ../../src/Lodestone.Web/App_Data/ml:/app/App_Data/ml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sql-data:
  data-protection-keys:
  https-certs:
