version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lodestone-db
    environment:
      SA_PASSWORD: "${SA_PASSWORD:-Your_strong_Pass123}"
      ACCEPT_EULA: "Y"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: lodestone-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__DefaultConnection: "Server=db;Database=Lodestone;User Id=sa;Password=${SA_PASSWORD:-Your_strong_Pass123};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__HangfireConnection: "Server=db;Database=Lodestone;User Id=sa;Password=${SA_PASSWORD:-Your_strong_Pass123};TrustServerCertificate=True;MultipleActiveResultSets=True"
      SeedData__AdminPassword: "${ADMIN_PASSWORD:-TempDevPassword123!}"
      SeedData__ResetAdminPassword: "true"
      Startup__UseHangfire: "true"
      Startup__InitializeDatabase: "true"
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - lodestone-appdata:/app/App_Data
      - lodestone-keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health/ml || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
  lodestone-appdata:
  lodestone-keys:
